<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Support</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>AI Support</h1>
                <p>Technická podpora pomocí AI</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </header>


        <main class="chat">

            <!-- Úvodní zpráva AI -->
            <div class="message ai-message">

                <div class="avatar">AI</div>

                <div class="message-content">

                    <div class="sender">
                        AI Support
                    </div>

                    <div class="bubble">
                        Ahoj! 👋<br>
                        Jsem AI asistent technické podpory.
                        S čím ti můžu pomoci?
                    </div>

                </div>

            </div>

        </main>


        <footer class="input-area">

            <textarea
                placeholder="Napiš svůj dotaz..."
                rows="1"
            ></textarea>

            <button>➤</button>

        </footer>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
